<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>hnhn</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6600" id="meta-theme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Base / HN theme (default) ── */
    body {
      font-family: Verdana, Geneva, sans-serif;
      background: #f6f6ef;
      color: #828282;
      font-size: 10pt;
    }

    header {
      background: #ff6600;
      padding: calc(4px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 4px calc(10px + env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 14px; color: #000; font-weight: 700; }
    .header-sub { font-size: 10px; color: #000; opacity: 0.6; }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn, .theme-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 12px;
      font-family: Verdana, Geneva, sans-serif;
      cursor: pointer;
      opacity: 0.6;
      padding: 2px 6px;
    }
    .refresh-btn:hover, .theme-btn:hover { opacity: 1; }

    #pull-indicator {
      text-align: center;
      font-size: 8pt;
      color: #828282;
      overflow: hidden;
      height: 0;
      transition: height 0.2s;
    }

    main { max-width: 85%; margin: 0 auto; }
    /* Keep content clear of the notch (landscape) and home indicator; the
       header pads itself so its color still reaches the screen edges. */
    main { padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    #status { padding: 5px 10px; color: #828282; font-size: 10pt; }
    #status:empty { display: none; }

    .item { padding: 6px 10px 6px 10px; border-bottom: 1px solid #e8e8e0; }

    .item-title-row { display: flex; align-items: baseline; gap: 6px; }
    .item-rank {
      color: #828282;
      font-size: 11pt;
      min-width: 32px;
      text-align: right;
      flex-shrink: 0;
    }
    .item-title a { font-size: 12pt; color: #000; text-decoration: none; }
    .item-title a:visited { color: #828282; }
    .item-title a:hover { text-decoration: underline; }
    .item-domain { font-size: 9pt; color: #828282; margin-left: 4px; }

    .item-zh {
      font-size: 9pt;
      color: #666;
      padding-left: 38px;
      padding-top: 3px;
      padding-bottom: 2px;
    }

    .item-quip {
      font-size: 9.5pt;
      color: #8a4210;
      line-height: 1.6;
      margin-bottom: 10px;
      padding-left: 1.3em;
      text-indent: -1.3em; /* wrapped lines align after the opening bracket */
    }
    /* Chinese corner brackets: the quip is Chinese, and they render cleanly. */
    .item-quip::before, .item-quip::after {
      color: #ff6600;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    .item-quip::before { content: "「"; display: inline-block; width: 1.3em; text-indent: 0; }
    .item-quip::after { content: "」"; }

    .item-summary {
      font-size: 9pt;
      color: #666;
      padding: 6px 10px;
      margin: 3px 0 3px 38px;
      background: #f0ead6;
      border-left: 2px solid #ff6600;
      line-height: 1.6;
      cursor: pointer; /* tapping it toggles "more" */
      -webkit-tap-highlight-color: transparent;
    }





    .glossary {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f0ead6;
      border: 1px solid #ddd;
    }
    .glossary h4 {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #828282;
      margin-bottom: 5px;
    }
    .glossary-item { font-size: 9pt; color: #666; margin-bottom: 3px; }
    .glossary-item strong { color: #000; }


    /* ── Discussion topics: plain "▸ topic" lines under the summary, styled like
       the original details. The summary and this area toggle the expanded view. ── */
    .item-summary.tappable, .chips { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* Desktop collapsed: topic lines wrap in one row. Expanded (and on phones):
       a vertical list where each topic line heads its own text. */
    .chips { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 16px; margin: 2px 0 6px 38px; }
    .chips.all-open { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
    .chip {
      background: none; border: 0; padding: 2px 0; margin: 0; font: inherit; cursor: pointer;
      max-width: 100%; text-align: left; -webkit-tap-highlight-color: transparent;
    }
    .chip > span {
      display: inline-block; vertical-align: top;
      font-size: 9pt; line-height: 1.6; color: #333;
      padding-left: 1em; text-indent: -1em; /* wrapped lines align after the ▸ */
    }
    .chip > span::before { content: "▸"; display: inline-block; width: 1em; text-indent: 0; color: #ff6600; }
    .chip.on > span { font-weight: 700; color: #000; }
    .chip.on > span::before { content: "▾"; }
    @media (hover: hover) { .chip:hover > span { color: #000; } body.dark .chip:hover > span { color: #fff; } }
    .chip:focus-visible { outline: none; }
    .chip:focus-visible > span { outline: 2px solid #ff6600; outline-offset: 1px; }
    .chip-body { margin: 1px 0 8px 1em; }
    .chip-body p { font-size: 9pt; color: #666; line-height: 1.6; }
    /* Quip and terms appear only in the expanded view (summary tap). */
    .chips-extra { display: none; align-self: stretch; flex-basis: 100%; }
    .chips.all-open .chips-extra { display: block; }
    .chips-extra .item-quip { margin: 4px 0 6px; }
    .chips-extra .glossary { margin: 6px 0 2px; }


    /* Left column: rank, then points / age / comments as small lines. Content
       starts at the original indent. */
    .item-g { display: flex; gap: 6px; }
    .gutter {
      width: 34px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-start;
      font: 7.5pt/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #828282; white-space: nowrap;
    }
    .gutter .item-rank { min-width: 0; margin-bottom: 1px; font-family: Verdana, Geneva, sans-serif; align-self: flex-end; }
    body.dark .gutter .item-rank { font-family: inherit; }
    .g-pts { color: #ff6600; font-weight: 700; }
    /* Points, age and comments form one link to the HN thread. */
    .g-meta { display: flex; flex-direction: column; align-items: flex-start; color: inherit; text-decoration: none; padding-bottom: 4px; }
    @media (hover: hover) { .g-meta:hover .g-age, .g-meta:hover .g-com { color: #000; } body.dark .g-meta:hover .g-age, body.dark .g-meta:hover .g-com { color: #ddd; } }
    .item-body { flex: 1; min-width: 0; }
    /* Desktop: the original "N points Xh ago | N comments" as one link, right side of
       the title line. Phones use the compact left column instead. */
    .g-meta { display: none; }
    .item-title { flex: 1; min-width: 0; }
    .t-meta { flex-shrink: 0; margin-left: auto; padding-left: 12px; white-space: nowrap; font-size: 9pt; color: #828282; text-decoration: none; }
    .t-meta .hl { color: #ff6600; font-weight: 700; }
    @media (hover: hover) { .t-meta:hover { text-decoration: underline; } }
    body.dark .t-meta { color: #666; }
    .item-g .item-zh { padding-left: 0; }
    .item-g .item-summary { margin-left: 0; }
    .item-g .chips { margin-left: 0; }
    body.dark .gutter { color: #666; }
    @media (max-width: 600px) {
      .item-g { gap: 4px; }
      .g-meta { display: flex; }
      .t-meta { display: none; }
      .gutter { width: 34px; }
      .g-meta { padding-bottom: 8px; } /* a bit more tap area */
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      body { font-size: 11pt; }
      main { max-width: 100%; }
      header { padding: calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left)); }
      header h1 { font-size: 15px; }
      .item { padding: 8px 8px 0 8px; }
      .item-rank { min-width: 24px; font-size: 11pt; }
      .item-title a { font-size: 12pt; line-height: 1.4; }
      .item-domain { font-size: 9pt; }
      .item-zh { font-size: 10pt; padding-left: 30px; }
      .item-summary { font-size: 10pt; margin-left: 30px; padding: 6px 10px; line-height: 1.6; }
      .glossary-item { font-size: 10pt; }
      .glossary h4 { font-size: 8pt; }
      .chips { flex-direction: column; flex-wrap: nowrap; align-items: stretch; margin-left: 30px; }
      .chip-item { display: block; max-width: 100%; }
      .chip-body { margin: 1px 0 6px 1em; }
      /* Compact rows; each is a full-width button so adjacent rows leave no dead space. */
      .chip { display: block; width: 100%; padding: 4px 0; }
      .chip > span { font-size: 10pt; line-height: 1.45; }
      .chip-body p { font-size: 10pt; }
      .item-quip { font-size: 10.5pt; }
    }

    /* ── Dark / newshacker theme ── */
    body.dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #999;
    }
    body.dark header {
      background: #141414;
      border-bottom: 1px solid #222;
    }
    body.dark header h1 { color: #ff6600; }
    body.dark .header-sub { color: #666; }
    body.dark .refresh-btn,
    body.dark .theme-btn { color: #888; }


    body.dark #pull-indicator { color: #666; }
    body.dark #status { color: #666; }

    body.dark .item { border-bottom-color: #1a1a1a; }
    body.dark .item-rank { color: #555; }
    body.dark .item-title a { color: #ddd; }
    body.dark .item-title a:visited { color: #888; }
    body.dark .item-domain { color: #555; }


    body.dark .item-zh { color: #999; }
    body.dark .item-quip { color: #e0a36b; }

    body.dark .item-summary {
      background: #141414;
      border-left-color: #ff660060;
      color: #999;
    }



    body.dark .glossary {
      background: #111;
      border-color: #222;
    }
    body.dark .glossary h4 { color: #555; }
    body.dark .glossary-item { color: #888; }
    body.dark .glossary-item strong { color: #ccc; }

    body.dark .chip > span { color: #bbb; }
    body.dark .chip.on > span { color: #ddd; }
    body.dark .chip-body p { color: #999; }
  </style>
</head>
<body>
  <header>
    <h1>hnhn</h1>
    <span class="header-sub">+ AI summaries</span>
    <span class="header-right">
      <button class="theme-btn" id="theme-btn" title="Switch theme">◑ theme</button>
      <button class="refresh-btn" id="refresh-btn" title="Refresh">↻ refresh</button>
    </span>
  </header>

  <div id="pull-indicator">↓ release to refresh</div>
  <main>
    <div id="stories"></div>
    <div id="status">Loading...</div>
  </main>

  <script>
    const HN = "https://hacker-news.firebaseio.com/v0";
    const NH = "https://api.newshacker.me";
    const BATCH = 30;

    let allIds = [];
    let loaded = 0;
    let loading = false;
    let gen = 0; // bumped on each refresh so in-flight loads can detect they are stale
    const nhCache = {};

    // ── Theme ──
    // Preference: "system" | "light" | "dark". Default follows OS.
    // v2 key: old code always wrote "light"/"dark" and locked users off system.
    const THEME_KEY = "hnhn-theme-v2";
    try { localStorage.removeItem("hnhn-theme"); } catch (_) {}

    function systemTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function resolveTheme(pref) {
      return pref === "system" ? systemTheme() : pref;
    }

    function applyTheme(pref) {
      const theme = resolveTheme(pref);
      document.body.classList.toggle("dark", theme === "dark");
      document.getElementById("meta-theme").content = theme === "dark" ? "#141414" : "#ff6600";
      // Label is the *current* preference (click cycles system → light → dark)
      document.getElementById("theme-btn").textContent =
        pref === "system" ? "◑ system" : pref === "light" ? "◑ light" : "◑ dark";
      document.getElementById("theme-btn").title =
        pref === "system"
          ? `Theme: system (${theme}) — click for light`
          : pref === "light"
            ? "Theme: light — click for dark"
            : "Theme: dark — click for system";
      themePref = pref;
      try { localStorage.setItem(THEME_KEY, pref); } catch (_) {}
    }

    let themePref = null;
    try { themePref = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (themePref !== "light" && themePref !== "dark" && themePref !== "system") {
      themePref = "system";
    }
    applyTheme(themePref);

    document.getElementById("theme-btn").addEventListener("click", () => {
      const next = themePref === "system" ? "light" : themePref === "light" ? "dark" : "system";
      applyTheme(next);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themePref === "system") applyTheme("system");
    });

    // ── Helpers ──
    function timeAgo(ts) {
      const diff = Math.floor(Date.now() / 1000) - ts;
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function domain(url) {
      if (!url) return null;
      try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return null; }
    }

    // Escapes quotes too, so the result is safe inside attribute values.
    function esc(s) {
      if (s == null) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function safeUrl(url, fallback) {
      try {
        const u = new URL(url);
        if (u.protocol === "http:" || u.protocol === "https:") return u.href;
      } catch {}
      return fallback;
    }

    // ── Data ──
    async function fetchHNItem(id) {
      const r = await fetch(`${HN}/item/${id}.json`);
      if (!r.ok) throw new Error(`HN item ${id}: ${r.status}`);
      return r.json();
    }

    function aiOf(data) {
      return (data && data.aiSummary) || null;
    }

    // Caches only finished summaries. New stories often have a null summary
    // at first, so those are fetched again on expand and on refresh.
    async function fetchNHItem(id) {
      if (nhCache[id]) return nhCache[id];
      try {
        const r = await fetch(`${NH}/item/${id}`);
        if (!r.ok) return null;
        const data = await r.json();
        if (aiOf(data)) nhCache[id] = data;
        return data;
      } catch {
        return null;
      }
    }

    // ── Render ──
    function renderItem(hn, rank) {
      const d = domain(hn.url);
      const hnLink = `https://news.ycombinator.com/item?id=${hn.id}`;
      const el = document.createElement("div");
      el.id = `item-${hn.id}`;
      el.innerHTML = `
        <div class="item item-g">
          <div class="gutter">
            <span class="item-rank">${rank}.</span>
            <a class="g-meta" href="https://news.ycombinator.com/item?id=${hn.id}" target="_blank" rel="noopener"
               title="${Number(hn.score) || 0} points · ${timeAgo(hn.time)} · ${Number(hn.descendants) || 0} comments">
              <span class="g-pts">${Number(hn.score) || 0}p</span>
              <span class="g-age">${timeAgo(hn.time).replace(" ago", "")}</span>
              <span class="g-com">${Number(hn.descendants) || 0}c</span>
            </a>
          </div>
          <div class="item-body">
            <div class="item-title-row">
              <span class="item-title">
                <a href="${esc(safeUrl(hn.url, hnLink))}" target="_blank" rel="noopener">${esc(hn.title)}</a>${d ? `<span class="item-domain"> (${esc(d)})</span>` : ""}
              </span>
              <a class="t-meta" href="https://news.ycombinator.com/item?id=${hn.id}" target="_blank" rel="noopener"><span class="hl">${Number(hn.score) || 0}</span> points | ${timeAgo(hn.time)} | <span class="hl">${Number(hn.descendants) || 0}</span> comments</a>
            </div>
          </div>
        </div>`;
      return el;
    }

    // Subtitle, summary and chips are appended in reading order, so expanding
    // a story only grows its bottom edge.
    function enrichItem(id, nh) {
      const el = document.getElementById(`item-${id}`);
      const ai = aiOf(nh);
      if (!el || !ai || el.dataset.enriched) return;
      el.dataset.enriched = "1";
      const box = el.querySelector(".item-body");
      if (ai.chinese_title) box.insertAdjacentHTML("beforeend", `<div class="item-zh">${esc(ai.chinese_title)}</div>`);
      if (ai.context) box.insertAdjacentHTML("beforeend", `<div class="item-summary">${esc(ai.context)}</div>`);
      const chips = chipsHtml(id, ai);
      if (chips) {
        box.insertAdjacentHTML("beforeend", chips);
        box.querySelector(".item-summary")?.classList.add("tappable");
      }
    }

    // ── Discussion chips ──
    function chipsHtml(id, ai) {
      const topics = (ai.discussion_overview || []).filter((t) => t && t.category);
      const terms = ai.terminologies || [];
      const quip = ai.sarcastic_question || "";
      if (!topics.length && !terms.length && !quip) return "";
      return `<div class="chips" role="group" aria-label="Discussion topics">
        ${quip ? `<div class="chips-extra chips-quip"><div class="item-quip">${esc(quip)}</div></div>` : ""}
        ${topics.map((t, i) => `
        <div class="chip-item">
          <button class="chip" aria-expanded="false" aria-controls="chip-body-${id}-${i}"><span>${esc(t.category)}</span></button>
          <div class="chip-body" id="chip-body-${id}-${i}" hidden><p>${esc(t.summary)}</p></div>
        </div>`).join("")}
        ${terms.length ? `<div class="chips-extra chips-terms"><div class="glossary"><h4>Terms</h4>${terms.map((g) =>
          `<div class="glossary-item"><strong>${esc(g.term)}:</strong> ${esc(g.explanation)}</div>`).join("")}</div></div>` : ""}
      </div>`;
    }

    function setChip(chip, open) {
      chip.classList.toggle("on", open);
      chip.setAttribute("aria-expanded", String(open));
      document.getElementById(chip.getAttribute("aria-controls")).hidden = !open;
    }

    // The summary and the topics area are one toggle: collapsed shows topic
    // lines only; expanded shows the quip, every topic and the terms.
    function toggleAllChips(item) {
      const box = item.querySelector(".chips");
      const expand = !box.classList.contains("all-open");
      box.classList.toggle("all-open", expand);
      box.querySelectorAll(".chip").forEach((c) => setChip(c, expand));
    }

    document.getElementById("stories").addEventListener("click", (e) => {
      // Ignore links and taps that end a text selection.
      if (e.target.closest("a") || String(window.getSelection())) return;
      const area = e.target.closest(".item-summary.tappable, .chips");
      if (area) toggleAllChips(area.closest("[id^=item-]"));
    });

    // ── Load ──
    function showError(msg) {
      document.getElementById("status").innerHTML =
        `${esc(msg)} <a href="#" id="retry-link">retry</a>`;
    }

    document.getElementById("status").addEventListener("click", (e) => {
      if (e.target.id !== "retry-link") return;
      e.preventDefault();
      if (allIds.length) loadMore(); else refresh();
    });

    async function loadMore() {
      if (loading || loaded >= allIds.length) return;
      const myGen = gen;
      loading = true;
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Loading...";

      const start = loaded;
      const batch = allIds.slice(start, start + BATCH);
      let hnItems;
      try {
        hnItems = await Promise.all(batch.map((id) => fetchHNItem(id).catch(() => null)));
      } finally {
        if (myGen === gen) loading = false;
      }
      // A refresh started while this batch was loading; drop the stale batch.
      if (myGen !== gen) return;

      if (hnItems.every((item) => !item)) {
        showError("Failed to load stories.");
        return;
      }

      const container = document.getElementById("stories");
      hnItems.forEach((item, i) => {
        if (item && !item.deleted && !item.dead) {
          container.appendChild(renderItem(item, start + i + 1));
        }
      });

      loaded = start + batch.length;
      statusEl.textContent = "";

      hnItems.forEach(item => {
        if (!item || item.deleted || item.dead) return;
        fetchNHItem(item.id).then(nh => {
          if (nh) enrichItem(item.id, nh);
        });
      });
    }

    // ── Scroll ──
    window.addEventListener("scroll", () => {
      if (loaded < allIds.length && window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadMore();
      }
    });

    // ── Load top stories (init + refresh) ──
    async function loadTop() {
      const myGen = ++gen;
      loading = false;
      loaded = 0;
      allIds = [];
      document.getElementById("stories").innerHTML = "";
      document.getElementById("status").textContent = "Loading...";
      let ids;
      try {
        const r = await fetch(`${HN}/topstories.json`);
        if (!r.ok) throw new Error(`topstories: ${r.status}`);
        ids = await r.json();
      } catch {
        if (myGen === gen) showError("Failed to load stories.");
        return;
      }
      if (myGen !== gen) return;
      allIds = ids;
      await loadMore();
    }

    let refreshing = false;
    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      const btn = document.getElementById("refresh-btn");
      btn.textContent = "↻ ...";
      try {
        await loadTop();
      } finally {
        refreshing = false;
        btn.textContent = "↻ refresh";
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", refresh);
    refresh();

    // ── Pull-to-refresh ──
    let touchStartY = 0;
    let pulling = false;
    const pullEl = document.getElementById("pull-indicator");

    document.addEventListener("touchstart", (e) => {
      if (window.scrollY === 0) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (touchStartY === 0) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 0 && window.scrollY === 0) {
        pulling = true;
        const h = Math.min(dy * 0.4, 40);
        pullEl.style.height = h + "px";
        pullEl.textContent = h >= 35 ? "↓ release to refresh" : "↓ pull to refresh";
      }
    }, { passive: true });

    document.addEventListener("touchend", () => {
      if (pulling && parseInt(pullEl.style.height) >= 35) {
        pullEl.textContent = "refreshing...";
        pullEl.style.height = "24px";
        refresh().then(() => {
          pullEl.style.height = "0";
        });
      } else {
        pullEl.style.height = "0";
      }
      touchStartY = 0;
      pulling = false;
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
