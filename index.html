<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hnhn</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6600" id="meta-theme">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Base / HN theme (default) ── */
    body {
      font-family: Verdana, Geneva, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      background: #f6f6ef;
      color: #6a6a6a;
      font-size: 10pt;
    }

    header {
      background: #ff6600;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 14px; color: #000; font-weight: 700; }
    .header-sub { font-size: 10px; color: #000; opacity: 0.75; white-space: nowrap; }
    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hdr-btn {
      background: none;
      border: none;
      color: #000;
      font-size: 12px;
      font-family: Verdana, Geneva, sans-serif;
      cursor: pointer;
      opacity: 0.75;
      padding: 2px 6px;
      white-space: nowrap;
    }
    .hdr-btn:hover, .hdr-btn[aria-pressed="true"] { opacity: 1; }
    .hdr-btn[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }

    #pull-indicator {
      text-align: center;
      font-size: 8pt;
      color: #6a6a6a;
      overflow: hidden;
      height: 0;
      transition: height 0.2s;
    }

    main { max-width: 760px; margin: 0 auto; }

    #status { padding: 5px 10px; color: #6a6a6a; font-size: 10pt; }
    #status:empty { display: none; }

    .item { padding: 6px 10px 6px 10px; border-bottom: 1px solid #e8e8e0; }

    .item-title-row { display: flex; align-items: baseline; gap: 6px; }
    .item-rank {
      color: #6a6a6a;
      font-size: 11pt;
      min-width: 32px;
      text-align: right;
      flex-shrink: 0;
    }
    .item-title a { font-size: 12pt; color: #000; text-decoration: none; }
    .item-title a:visited { color: #6a6a6a; }
    .item-title a:hover { text-decoration: underline; }
    .item-domain { font-size: 9pt; color: #6a6a6a; margin-left: 4px; }

    .item-zh {
      font-size: 9pt;
      color: #666;
      padding-left: 38px;
      padding-top: 3px;
      padding-bottom: 2px;
    }

    .item-quip {
      font-size: 9pt;
      color: #666;
      font-weight: 600;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: #f0ead6;
      border-left: 2px solid #ff6600;
      line-height: 1.6;
    }

    .item-summary {
      font-size: 9pt;
      color: #666;
      padding: 6px 10px;
      margin: 3px 0 3px 38px;
      background: #f0ead6;
      border-left: 2px solid #ff6600;
      line-height: 1.6;
    }
    .summary-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }
    .item-summary:focus-visible { outline: 2px solid #ff6600; outline-offset: 1px; }
    body.compact .item-summary { display: none; }

    .item-emoji { margin-right: 2px; }
    .new-badge { color: #b84a00; font-size: 8pt; font-weight: 700; margin-left: 6px; }
    .read .item-title a, .read .item-title a:visited { color: #6a6a6a; }
    .item-wrap.hide { display: none; }

    #to-top {
      position: fixed;
      right: 14px;
      bottom: 18px;
      background: #f6f6ef;
      color: #000;
      border: 1px solid #ff6600;
      font: 11px Verdana, Geneva, sans-serif;
      padding: 8px 12px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #to-top.visible { opacity: 0.9; pointer-events: auto; }
    #to-top:hover { opacity: 1; }

    /* Story body opens the post page; links and buttons keep their own action. */
    .item { cursor: pointer; }
    .item a, .item button { cursor: pointer; }
    .item:hover { background: rgba(0, 0, 0, 0.025); }

    /* ── Post page (#/item/<id>) ── */
    #post-view { display: none; padding: 4px 10px 40px; }
    body.post-open #post-view { display: block; }
    body.post-open #stories, body.post-open #status,
    body.post-open #compact-btn, body.post-open #hide-read-btn { display: none; }
    .back-btn {
      background: none; border: none; color: #6a6a6a; cursor: pointer;
      font: 9pt Verdana, Geneva, sans-serif; padding: 8px 0; margin-bottom: 4px;
    }
    .back-btn:hover { color: #000; }
    .post-title { font-size: 14pt; font-weight: normal; line-height: 1.35; }
    .post-title a { color: #000; text-decoration: none; }
    .post-title a:hover { text-decoration: underline; }
    .post-domain { font-size: 9pt; color: #6a6a6a; margin-top: 2px; }
    .post-zh { font-size: 10pt; color: #666; margin-top: 6px; }
    .post-meta { font-size: 9pt; color: #6a6a6a; margin-top: 8px; line-height: 1.6; }
    .post-meta a { color: #6a6a6a; }
    .post-meta .hl { color: #b84a00; font-weight: 700; }
    .post-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    .post-btn {
      font: 9pt Verdana, Geneva, sans-serif; color: #000; background: #fff;
      border: 1px solid #d8d2bd; padding: 6px 12px; text-decoration: none; cursor: pointer;
    }
    .post-btn:hover { border-color: #ff6600; }
    .post-text, .post-summary { font-size: 10pt; line-height: 1.7; margin-bottom: 12px; }
    .post-text { color: #222; overflow-wrap: anywhere; }
    .post-text p { margin-top: 8px; }
    .post-summary { color: #444; padding: 8px 12px; background: #f0ead6; border-left: 2px solid #ff6600; }
    .post-section { margin-top: 20px; }
    .post-section > h3 {
      font-size: 10pt; color: #000; padding-bottom: 4px; margin-bottom: 4px;
      border-bottom: 1px solid #e8e8e0;
    }
    .comment { padding: 9px 0; border-bottom: 1px solid #e8e8e0; }
    .comment-meta { font-size: 8pt; color: #6a6a6a; margin-bottom: 4px; }
    .comment-meta a { color: #6a6a6a; }
    .comment-text { font-size: 9pt; color: #222; line-height: 1.6; overflow-wrap: anywhere; }
    .comment-text p { margin-top: 6px; }
    .comment-text a, .post-text a { color: #6a6a6a; }
    .comment-text pre, .post-text pre {
      white-space: pre-wrap; font-size: 8pt; background: #f0ead6; padding: 6px 8px; margin-top: 6px;
    }
    .more-comments { margin-top: 10px; }
    .related-item { font-size: 9pt; padding: 5px 0; }
    .related-item a { color: #000; text-decoration: none; }
    .related-item a:hover { text-decoration: underline; }
    .related-meta { color: #6a6a6a; font-size: 8pt; }

    .item-footer {
      padding-left: 38px;
      padding-bottom: 5px;
      padding-top: 2px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .item-sub {
      font-size: 9pt;
      color: #6a6a6a;
      margin-left: auto;
      line-height: 1.6;
    }
    .item-sub a { color: #6a6a6a; text-decoration: none; }
    .item-sub a:hover { text-decoration: underline; }
    .item-sub .hl { color: #b84a00; font-weight: 700; }

    .expand-btn {
      background: none;
      border: none;
      color: #6a6a6a;
      font-size: 9pt;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-family: Verdana, Geneva, sans-serif;
      display: none;
    }
    .expand-btn.visible { display: inline; }
    .expand-btn:hover { color: #b84a00; }

    .detail-content {
      display: none;
      margin-top: 8px;
      padding-left: 38px;
      padding-bottom: 4px;
    }
    .detail-content.open { display: block; }

    .discussion-section { margin-bottom: 12px; }
    .discussion-section h3 {
      font-size: 10pt;
      font-weight: 700;
      color: #000;
      margin-bottom: 3px;
    }
    .discussion-section p { font-size: 9pt; color: #666; line-height: 1.6; }

    .glossary {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f0ead6;
      border: 1px solid #ddd;
    }
    .glossary h4 {
      font-size: 8pt;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6a6a6a;
      margin-bottom: 5px;
    }
    .glossary-item { font-size: 9pt; color: #666; margin-bottom: 3px; }
    .glossary-item strong { color: #000; }

    .loading-detail { font-size: 9pt; color: #6a6a6a; padding: 5px 0; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      body { font-size: 11pt; }
      main { max-width: 100%; }
      header { padding: 0 6px 0 10px; gap: 6px; }
      header h1 { font-size: 15px; }
      .header-right { gap: 0; }
      .hdr-btn { min-height: 40px; padding: 0 7px; font-size: 12px; }
      .btn-label { display: none; }
      .item-sub a { display: inline-block; line-height: 40px; }
      .back-btn { min-height: 40px; font-size: 10pt; }
      .post-title { font-size: 15pt; }
      .post-zh { font-size: 11pt; }
      .post-btn { min-height: 40px; display: inline-flex; align-items: center; font-size: 10pt; }
      .post-text, .post-summary { font-size: 11pt; }
      .comment-text { font-size: 10.5pt; }
      .comment-meta { font-size: 9pt; }
      .comment-meta a, .post-meta a { display: inline-block; line-height: 32px; }
      .related-item { font-size: 10pt; padding: 8px 0; }
      .item { padding: 8px 8px 0 8px; }
      .item-rank { min-width: 24px; font-size: 11pt; }
      .item-title a { font-size: 12pt; line-height: 1.4; }
      .item-domain { font-size: 9pt; }
      .item-zh { font-size: 10pt; padding-left: 30px; }
      .item-footer { padding-left: 30px; flex-wrap: wrap; }
      .item-sub { font-size: 9pt; }
      .item-summary { font-size: 10pt; margin-left: 30px; padding: 6px 10px; line-height: 1.6; }
      .detail-content { padding-left: 30px; }
      .expand-btn { font-size: 9pt; padding: 0 12px 0 0; min-height: 40px; }
      .discussion-section h3 { font-size: 10pt; }
      .discussion-section p { font-size: 10pt; line-height: 1.6; }
      .glossary-item { font-size: 10pt; }
      .glossary h4 { font-size: 8pt; }
      .loading-detail { font-size: 10pt; }
    }

    /* ── Dark / newshacker theme ── */
    body.dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      background: #0a0a0a;
      color: #999;
    }
    body.dark header {
      background: #141414;
      border-bottom: 1px solid #222;
    }
    body.dark header h1 { color: #ff6600; }
    body.dark .header-sub { color: #8a8a8a; }


    body.dark #pull-indicator { color: #8a8a8a; }
    body.dark #status { color: #8a8a8a; }

    body.dark .item { border-bottom-color: #1a1a1a; }
    body.dark .item-rank { color: #858585; }
    body.dark .item-title a { color: #ddd; }
    body.dark .item-title a:visited { color: #888; }
    body.dark .item-domain { color: #858585; }

    body.dark .item-sub { color: #8a8a8a; }
    body.dark .item-sub a { color: #8a8a8a; }
    body.dark .item-sub .hl { color: #ff6600; }

    body.dark .item-zh { color: #999; }
    body.dark .item-quip {
      color: #ccc;
      background: #141414;
      border-left-color: #ff660060;
    }

    body.dark .item-summary {
      background: #141414;
      border-left-color: #ff660060;
      color: #999;
    }

    body.dark .expand-btn { color: #8a8a8a; }
    body.dark .expand-btn:hover { color: #ff6600; }

    body.dark .discussion-section h3 { color: #ff8c00; }
    body.dark .discussion-section p { color: #999; }

    body.dark .glossary {
      background: #111;
      border-color: #222;
    }
    body.dark .glossary h4 { color: #858585; }
    body.dark .glossary-item { color: #888; }
    body.dark .glossary-item strong { color: #ccc; }

    body.dark .loading-detail { color: #858585; }

    body.dark .hdr-btn { color: #aaa; }
    body.dark .item-summary:focus-visible { outline-color: #ff660090; }
    body.dark .new-badge { color: #ff8c00; }
    body.dark .read .item-title a, body.dark .read .item-title a:visited { color: #7d7d7d; }
    body.dark #to-top { background: #141414; color: #ccc; border-color: #ff660090; }

    body.dark .item:hover { background: rgba(255, 255, 255, 0.025); }
    body.dark .back-btn { color: #8a8a8a; }
    body.dark .back-btn:hover { color: #ddd; }
    body.dark .post-title a { color: #eee; }
    body.dark .post-domain, body.dark .post-meta, body.dark .post-meta a { color: #8a8a8a; }
    body.dark .post-meta .hl { color: #ff6600; }
    body.dark .post-zh { color: #aaa; }
    body.dark .post-btn { color: #ddd; background: #141414; border-color: #2a2a2a; }
    body.dark .post-btn:hover { border-color: #ff660090; }
    body.dark .post-summary { color: #aaa; background: #141414; border-left-color: #ff660060; }
    body.dark .post-text, body.dark .comment-text { color: #c8c8c8; }
    body.dark .post-section > h3 { color: #ff8c00; border-bottom-color: #222; }
    body.dark .comment { border-bottom-color: #1a1a1a; }
    body.dark .comment-meta, body.dark .comment-meta a, body.dark .related-meta { color: #8a8a8a; }
    body.dark .comment-text a, body.dark .post-text a { color: #9a9a9a; }
    body.dark .comment-text pre, body.dark .post-text pre { background: #141414; }
    body.dark .related-item a { color: #ddd; }
  </style>
</head>
<body>
  <header>
    <h1>hnhn</h1>
    <span class="header-sub" title="Hacker News + AI summaries"><span class="btn-label">updated </span><span id="updated-ago">…</span></span>
    <span class="header-right">
      <button class="hdr-btn" id="compact-btn" aria-pressed="false" title="Hide summaries">compact</button>
      <button class="hdr-btn" id="hide-read-btn" aria-pressed="false" title="Hide stories you have read">hide read</button>
      <button class="hdr-btn" id="theme-btn" title="Switch theme">◑ theme</button>
      <button class="hdr-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">↻<span class="btn-label" id="refresh-label"> refresh</span></button>
    </span>
  </header>

  <div id="pull-indicator">↓ release to refresh</div>
  <main>
    <section id="post-view" aria-live="polite"></section>
    <div id="stories"></div>
    <div id="status">Loading...</div>
  </main>
  <button id="to-top" title="Back to top">↑ top</button>

  <script>
    const HN = "https://hacker-news.firebaseio.com/v0";
    const NH = "https://api.newshacker.me";
    const BATCH = 30;

    let allIds = [];
    let loaded = 0;
    let loading = false;
    let gen = 0; // bumped on each refresh so in-flight loads can detect they are stale
    const nhCache = {};

    // ── Local prefs ──
    function loadJSON(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
    }
    function saveJSON(key, v) {
      try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
    }

    // Read stories: opened, expanded, or comments clicked. Newest last, capped.
    const READ_KEY = "hnhn-read";
    const READ_MAX = 500;
    let readIds = loadJSON(READ_KEY, []);
    if (!Array.isArray(readIds)) readIds = [];
    const readSet = new Set(readIds);

    function markRead(id) {
      id = Number(id);
      if (readSet.has(id)) return;
      readSet.add(id);
      readIds.push(id);
      if (readIds.length > READ_MAX) readSet.delete(readIds.shift());
      saveJSON(READ_KEY, readIds);
      // Dim only; the story stays visible until "hide read" is toggled again.
      document.getElementById(`item-${id}`)?.classList.add("read");
    }

    // "new" = in the top list now but not in the list from the previous load.
    const PREV_TOP_KEY = "hnhn-prev-top";
    let newIds = new Set();

    // ── Compact / hide read toggles ──
    let compact = loadJSON("hnhn-compact", false) === true;
    let hideRead = loadJSON("hnhn-hide-read", false) === true;

    function applyCompact() {
      document.body.classList.toggle("compact", compact);
      document.getElementById("compact-btn").setAttribute("aria-pressed", String(compact));
    }

    function applyHideRead() {
      document.getElementById("hide-read-btn").setAttribute("aria-pressed", String(hideRead));
      document.querySelectorAll(".item-wrap").forEach((el) =>
        el.classList.toggle("hide", hideRead && el.classList.contains("read")));
    }

    document.getElementById("compact-btn").addEventListener("click", () => {
      compact = !compact;
      saveJSON("hnhn-compact", compact);
      applyCompact();
      maybeLoadMore();
    });

    document.getElementById("hide-read-btn").addEventListener("click", () => {
      hideRead = !hideRead;
      saveJSON("hnhn-hide-read", hideRead);
      applyHideRead();
      maybeLoadMore();
    });

    // ── "updated Xm ago" ──
    let lastUpdated = 0;
    function renderUpdated() {
      const el = document.getElementById("updated-ago");
      if (!lastUpdated) { el.textContent = "…"; return; }
      const mins = Math.floor((Date.now() - lastUpdated) / 60000);
      el.textContent = mins < 1 ? "just now" : mins < 60 ? `${mins}m ago` : `${Math.floor(mins / 60)}h ago`;
    }
    setInterval(renderUpdated, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) renderUpdated(); });

    // ── Theme ──
    // Preference: "system" | "light" | "dark". Default follows OS.
    // v2 key: old code always wrote "light"/"dark" and locked users off system.
    const THEME_KEY = "hnhn-theme-v2";
    try { localStorage.removeItem("hnhn-theme"); } catch (_) {}

    function systemTheme() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function resolveTheme(pref) {
      return pref === "system" ? systemTheme() : pref;
    }

    function applyTheme(pref) {
      const theme = resolveTheme(pref);
      document.body.classList.toggle("dark", theme === "dark");
      document.getElementById("meta-theme").content = theme === "dark" ? "#141414" : "#ff6600";
      // Label is the *current* preference (click cycles system → light → dark)
      document.getElementById("theme-btn").textContent =
        pref === "system" ? "◑ system" : pref === "light" ? "◑ light" : "◑ dark";
      document.getElementById("theme-btn").title =
        pref === "system"
          ? `Theme: system (${theme}) — click for light`
          : pref === "light"
            ? "Theme: light — click for dark"
            : "Theme: dark — click for system";
      themePref = pref;
      try { localStorage.setItem(THEME_KEY, pref); } catch (_) {}
    }

    let themePref = null;
    try { themePref = localStorage.getItem(THEME_KEY); } catch (_) {}
    if (themePref !== "light" && themePref !== "dark" && themePref !== "system") {
      themePref = "system";
    }
    applyTheme(themePref);

    document.getElementById("theme-btn").addEventListener("click", () => {
      const next = themePref === "system" ? "light" : themePref === "light" ? "dark" : "system";
      applyTheme(next);
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (themePref === "system") applyTheme("system");
    });

    // ── Helpers ──
    function timeAgo(ts) {
      const diff = Math.floor(Date.now() / 1000) - ts;
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      if (diff < 86400 * 365) return `${Math.floor(diff / 86400)}d ago`;
      return `${Math.floor(diff / (86400 * 365))}y ago`;
    }

    function domain(url) {
      if (!url) return null;
      try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return null; }
    }

    // Escapes quotes too, so the result is safe inside attribute values.
    function esc(s) {
      if (s == null) return "";
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    function safeUrl(url, fallback) {
      try {
        const u = new URL(url);
        if (u.protocol === "http:" || u.protocol === "https:") return u.href;
      } catch {}
      return fallback;
    }

    // ── Data ──
    const hnCache = {};
    async function fetchHNItem(id) {
      const r = await fetch(`${HN}/item/${id}.json`);
      if (!r.ok) throw new Error(`HN item ${id}: ${r.status}`);
      const item = await r.json();
      if (item) hnCache[item.id] = item;
      return item;
    }

    function aiOf(data) {
      return (data && data.aiSummary) || null;
    }

    // Caches only finished summaries. New stories often have a null summary
    // at first, so those are fetched again on expand and on refresh.
    async function fetchNHItem(id) {
      if (nhCache[id]) return nhCache[id];
      try {
        const r = await fetch(`${NH}/item/${id}`);
        if (!r.ok) return null;
        const data = await r.json();
        if (aiOf(data)) nhCache[id] = data;
        return data;
      } catch {
        return null;
      }
    }

    // ── Render ──
    function renderItem(hn, rank) {
      const d = domain(hn.url);
      const hnLink = `https://news.ycombinator.com/item?id=${hn.id}`;
      const el = document.createElement("div");
      el.id = `item-${hn.id}`;
      el.className = "item-wrap";
      if (readSet.has(hn.id)) el.classList.add("read");
      if (hideRead && readSet.has(hn.id)) el.classList.add("hide");
      el.innerHTML = `
        <div class="item">
          <div class="item-title-row">
            <span class="item-rank">${rank}.</span>
            <span class="item-title">
              <a class="story-link" data-id="${hn.id}" href="${esc(safeUrl(hn.url, hnLink))}" target="_blank" rel="noopener">${esc(hn.title)}</a>${d ? `<span class="item-domain"> (${esc(d)})</span>` : ""}${newIds.has(hn.id) ? `<span class="new-badge">new</span>` : ""}
            </span>
          </div>
          <div class="item-footer">
            <button class="expand-btn" data-id="${hn.id}" aria-expanded="false" aria-controls="detail-${hn.id}">more</button>
            <span class="item-sub">
              <span class="hl">${hn.score || 0}</span> points ${timeAgo(hn.time)} | <a class="story-link" data-id="${hn.id}" href="${esc(hnLink)}" target="_blank" rel="noopener"><span class="hl">${hn.descendants || 0}</span> comments</a>
            </span>
          </div>
          <div class="detail-content" id="detail-${hn.id}"></div>
        </div>`;
      return el;
    }

    function enrichItem(id, nh) {
      const el = document.getElementById(`item-${id}`);
      const ai = aiOf(nh);
      if (!el || !ai) return;

      const context = ai.context || "";
      const zhTitle = ai.chinese_title || "";
      const emoji = ai.emoji || "";

      if (zhTitle) {
        const titleRow = el.querySelector(".item-title-row");
        if (titleRow && !el.querySelector(".item-zh")) {
          titleRow.insertAdjacentHTML("afterend",
            `<div class="item-zh" lang="zh-CN">${emoji ? `<span class="item-emoji">${esc(emoji)}</span> ` : ""}${esc(zhTitle)}</div>`);
        }
      }

      if (context) {
        const footer = el.querySelector(".item-footer");
        if (footer && !el.querySelector(".item-summary")) {
          footer.insertAdjacentHTML("beforebegin",
            `<div class="item-summary" lang="zh-CN" data-id="${id}" role="link" tabindex="0" title="Open post"><div class="summary-text">${esc(context)}</div></div>`);
        }
      }

      const expandBtn = el.querySelector(".expand-btn");
      if (expandBtn) expandBtn.classList.add("visible");
    }

    function renderDetail(data) {
      const ai = aiOf(data) || {};
      const overview = ai.discussion_overview || [];
      const terms = ai.terminologies || [];
      const quip = ai.sarcastic_question || "";

      if (!overview.length && !terms.length && !quip) {
        return `<p class="loading-detail">No discussion details available.</p>`;
      }

      let html = "";
      if (quip) {
        html += `<div class="item-quip">${esc(quip)}</div>`;
      }
      if (overview.length) {
        html += overview.map(s => `
          <div class="discussion-section">
            <h3>${esc(s.category)}</h3>
            <p>${esc(s.summary)}</p>
          </div>`).join("");
      }
      if (terms.length) {
        html += `<div class="glossary"><h4>Terms</h4>
          ${terms.map(g => `<div class="glossary-item"><strong>${esc(g.term)}:</strong> ${esc(g.explanation)}</div>`).join("")}
        </div>`;
      }
      return html;
    }

    // ── Load ──
    function showError(msg) {
      document.getElementById("status").innerHTML =
        `${esc(msg)} <a href="#" id="retry-link">retry</a>`;
    }

    document.getElementById("status").addEventListener("click", (e) => {
      if (e.target.id !== "retry-link") return;
      e.preventDefault();
      if (allIds.length) loadMore(); else refresh();
    });

    async function loadMore() {
      if (loading || loaded >= allIds.length) return;
      const myGen = gen;
      loading = true;
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Loading...";

      const start = loaded;
      const batch = allIds.slice(start, start + BATCH);
      let hnItems;
      try {
        hnItems = await Promise.all(batch.map((id) => fetchHNItem(id).catch(() => null)));
      } finally {
        if (myGen === gen) loading = false;
      }
      // A refresh started while this batch was loading; drop the stale batch.
      if (myGen !== gen) return;

      if (hnItems.every((item) => !item)) {
        showError("Failed to load stories.");
        return;
      }

      const container = document.getElementById("stories");
      hnItems.forEach((item, i) => {
        if (item && !item.deleted && !item.dead) {
          container.appendChild(renderItem(item, start + i + 1));
        }
      });

      loaded = start + batch.length;
      statusEl.textContent = "";

      hnItems.forEach(item => {
        if (!item || item.deleted || item.dead) return;
        fetchNHItem(item.id).then(nh => {
          if (nh) enrichItem(item.id, nh);
        });
      });
      requestAnimationFrame(maybeLoadMore);
    }

    // ── Expand ──
    document.getElementById("stories").addEventListener("click", async (e) => {
      const btn = e.target.closest(".expand-btn");
      if (!btn) return;
      const id = btn.dataset.id;
      const container = document.getElementById(`detail-${id}`);
      if (container.classList.contains("open")) {
        container.classList.remove("open");
        btn.textContent = "more";
        btn.setAttribute("aria-expanded", "false");
        return;
      }
      markRead(id);
      btn.textContent = "loading...";
      btn.disabled = true;
      try {
        const data = await fetchNHItem(id);
        if (data) {
          container.innerHTML = renderDetail(data);
        } else {
          container.innerHTML = `<p class="loading-detail">No AI summary available.</p>`;
        }
        container.classList.add("open");
        btn.textContent = "less";
      } catch {
        container.innerHTML = `<p class="loading-detail">Failed to load.</p>`;
        container.classList.add("open");
        btn.textContent = "less";
      }
      btn.setAttribute("aria-expanded", "true");
      btn.disabled = false;
    });

    // Clicking the story body (not a link or button) opens the post page.
    document.getElementById("stories").addEventListener("click", (e) => {
      if (e.target.closest("a, button, .detail-content") || String(window.getSelection())) return;
      const wrap = e.target.closest(".item-wrap");
      if (wrap) openPost(wrap.id.slice(5));
    });
    document.getElementById("stories").addEventListener("keydown", (e) => {
      const sum = e.target.closest(".item-summary");
      if (sum && e.key === "Enter") openPost(sum.dataset.id);
    });
    for (const type of ["click", "auxclick"]) {
      document.getElementById("stories").addEventListener(type, (e) => {
        const link = e.target.closest("a.story-link");
        if (link && (type === "click" || e.button === 1)) markRead(link.dataset.id);
      });
    }

    // ── Scroll ──
    // Also called after toggles and loads: hiding stories can leave the page
    // too short to scroll, which would otherwise stop infinite scroll.
    function maybeLoadMore() {
      if (postOpen()) return;
      if (loaded < allIds.length && window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadMore();
      }
    }

    const toTop = document.getElementById("to-top");
    window.addEventListener("scroll", () => {
      maybeLoadMore();
      toTop.classList.toggle("visible", window.scrollY > window.innerHeight * 2);
    });
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    // ── Post page ──
    // Hash route #/item/<id>: works on static hosting, and the list stays in
    // the DOM (hidden) so going back restores it at the same scroll position.
    let currentPostId = null;
    let postGen = 0;
    let listScrollY = 0;
    const COMMENTS_PAGE = 10;

    function postOpen() { return document.body.classList.contains("post-open"); }

    function openPost(id) {
      history.pushState({ inApp: true }, "", `#/item/${id}`);
      route();
    }

    function closePost() {
      if (history.state && history.state.inApp) history.back();
      else { history.replaceState(null, "", location.pathname + location.search); route(); }
    }

    function route() {
      const m = location.hash.match(/^#\/item\/(\d+)$/);
      // popstate and hashchange can both fire for one navigation.
      if (m && postOpen() && currentPostId === Number(m[1])) return;
      if (m) showPost(Number(m[1]));
      else showList();
    }
    window.addEventListener("popstate", route);
    window.addEventListener("hashchange", route);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && postOpen()) closePost();
    });

    function showList() {
      if (!postOpen()) return;
      postGen++;
      currentPostId = null;
      document.body.classList.remove("post-open");
      document.getElementById("post-view").innerHTML = "";
      document.title = "hnhn";
      window.scrollTo(0, listScrollY);
      maybeLoadMore();
    }

    // HN comment/story text is HTML. Rebuild it from an inert parsed copy,
    // keeping only simple formatting tags and http(s) links.
    const ALLOWED_TAGS = new Set(["P", "A", "I", "EM", "B", "STRONG", "PRE", "CODE", "BR"]);
    function sanitizeHN(html) {
      const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
      const out = document.createElement("div");
      (function walk(src, dst) {
        for (const n of src.childNodes) {
          if (n.nodeType === Node.TEXT_NODE) { dst.appendChild(document.createTextNode(n.textContent)); continue; }
          if (n.nodeType !== Node.ELEMENT_NODE || n.tagName === "SCRIPT" || n.tagName === "STYLE") continue;
          if (!ALLOWED_TAGS.has(n.tagName)) { walk(n, dst); continue; }
          const el = document.createElement(n.tagName);
          if (n.tagName === "A") {
            const href = safeUrl(n.getAttribute("href"), null);
            if (href) { el.href = href; el.target = "_blank"; el.rel = "noopener nofollow"; }
          }
          walk(n, el);
          dst.appendChild(el);
        }
      })(doc.body.firstChild, out);
      return out.innerHTML;
    }

    function userLink(by) {
      if (!by) return "[deleted]";
      return `<a href="https://news.ycombinator.com/user?id=${encodeURIComponent(by)}" target="_blank" rel="noopener">${esc(by)}</a>`;
    }

    async function showPost(id) {
      const myGen = ++postGen;
      if (!postOpen()) listScrollY = window.scrollY;
      currentPostId = id;
      document.body.classList.add("post-open");
      window.scrollTo(0, 0);
      markRead(id);
      const view = document.getElementById("post-view");
      const back = `<button class="back-btn" id="back-btn">← back to stories</button>`;
      view.innerHTML = `${back}<p class="loading-detail">Loading...</p>`;

      let hn = hnCache[id];
      if (!hn) {
        try { hn = await fetchHNItem(id); } catch { hn = undefined; }
        if (myGen !== postGen) return;
      }
      if (hn === undefined) {
        view.innerHTML = `${back}<p class="loading-detail">Failed to load. <a href="#" id="post-retry">retry</a></p>`;
        return;
      }
      if (!hn || hn.deleted || hn.dead) {
        view.innerHTML = `${back}<p class="loading-detail">Story not found.</p>`;
        return;
      }

      const hnLink = `https://news.ycombinator.com/item?id=${hn.id}`;
      const url = safeUrl(hn.url, null);
      const d = domain(hn.url);
      document.title = `${hn.title} — hnhn`;
      view.innerHTML = `${back}
        <article>
          <h2 class="post-title"><a href="${esc(url || hnLink)}" target="_blank" rel="noopener">${esc(hn.title)}</a></h2>
          ${d ? `<div class="post-domain">${esc(d)}</div>` : ""}
          <div class="post-zh" id="post-zh" lang="zh-CN"></div>
          <div class="post-meta">
            <span class="hl">${Number(hn.score) || 0}</span> points by ${userLink(hn.by)} ${timeAgo(hn.time)}
            | <a href="${esc(hnLink)}" target="_blank" rel="noopener"><span class="hl">${Number(hn.descendants) || 0}</span> comments</a>
          </div>
          <div class="post-actions">
            ${url ? `<a class="post-btn" href="${esc(url)}" target="_blank" rel="noopener">open article ↗</a>` : ""}
            <a class="post-btn" href="${esc(hnLink)}" target="_blank" rel="noopener">discuss on HN ↗</a>
          </div>
          ${hn.text ? `<div class="post-text">${sanitizeHN(hn.text)}</div>` : ""}
          <section id="post-ai"><p class="loading-detail">Loading AI summary...</p></section>
          <section class="post-section">
            <h3>Top comments</h3>
            <div id="post-comments"></div>
            <div id="post-comments-status"><p class="loading-detail">Loading comments...</p></div>
          </section>
          <section class="post-section" id="post-related-wrap" hidden>
            <h3>Other discussions of this link</h3>
            <div id="post-related"></div>
          </section>
        </article>`;

      fetchNHItem(id).then((nh) => { if (myGen === postGen) renderPostAI(nh); });
      loadComments(hn, 0, myGen);
      if (url) loadRelated(hn, url, myGen);
    }

    function renderPostAI(nh) {
      const ai = aiOf(nh);
      const box = document.getElementById("post-ai");
      if (!ai) { box.innerHTML = `<p class="loading-detail">No AI summary yet.</p>`; return; }
      if (ai.chinese_title) {
        document.getElementById("post-zh").innerHTML =
          `${ai.emoji ? `<span class="item-emoji">${esc(ai.emoji)}</span> ` : ""}${esc(ai.chinese_title)}`;
      }
      box.innerHTML =
        (ai.context ? `<div class="post-summary" lang="zh-CN">${esc(ai.context)}</div>` : "") +
        `<div class="post-section"><h3>Discussion</h3>${renderDetail(nh)}</div>`;
    }

    async function loadComments(hn, start, myGen) {
      const kids = hn.kids || [];
      const status = document.getElementById("post-comments-status");
      if (!kids.length) { status.innerHTML = `<p class="loading-detail">No comments yet.</p>`; return; }
      status.innerHTML = `<p class="loading-detail">Loading comments...</p>`;
      const page = kids.slice(start, start + COMMENTS_PAGE);
      const items = await Promise.all(page.map((k) => fetchHNItem(k).catch(() => null)));
      if (myGen !== postGen) return;
      const html = items
        .filter((c) => c && !c.deleted && !c.dead && c.text)
        .map((c) => {
          const replies = (c.kids || []).length;
          const cLink = `https://news.ycombinator.com/item?id=${c.id}`;
          return `<div class="comment">
            <div class="comment-meta">${userLink(c.by)} ${timeAgo(c.time)}${replies ? ` | <a href="${esc(cLink)}" target="_blank" rel="noopener">${replies} ${replies === 1 ? "reply" : "replies"}</a>` : ""}</div>
            <div class="comment-text">${sanitizeHN(c.text)}</div>
          </div>`;
        }).join("");
      document.getElementById("post-comments").insertAdjacentHTML("beforeend", html);
      const next = start + COMMENTS_PAGE;
      status.innerHTML = next < kids.length
        ? `<button class="post-btn more-comments" id="more-comments" data-next="${next}">more comments (${kids.length - next} left)</button>`
        : "";
    }

    // Other HN submissions of the same URL, via the Algolia HN search API.
    async function loadRelated(hn, url, myGen) {
      const norm = (u) => (u || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/+$/, "");
      try {
        const r = await fetch(`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(url)}&restrictSearchableAttributes=url&hitsPerPage=20`);
        if (!r.ok) return;
        const data = await r.json();
        if (myGen !== postGen) return;
        const hits = (data.hits || [])
          .filter((h) => String(h.objectID) !== String(hn.id) && norm(h.url) === norm(url))
          .sort((a, b) => (b.points || 0) - (a.points || 0))
          .slice(0, 5);
        if (!hits.length) return;
        document.getElementById("post-related").innerHTML = hits.map((h) => `
          <div class="related-item">
            <a href="#/item/${encodeURIComponent(h.objectID)}" class="related-link" data-id="${esc(h.objectID)}">${esc(h.title)}</a>
            <div class="related-meta">${Number(h.points) || 0} points · ${Number(h.num_comments) || 0} comments · ${timeAgo(h.created_at_i)}</div>
          </div>`).join("");
        document.getElementById("post-related-wrap").hidden = false;
      } catch {}
    }

    document.getElementById("post-view").addEventListener("click", (e) => {
      if (e.target.closest("#back-btn")) { closePost(); return; }
      if (e.target.id === "post-retry") { e.preventDefault(); showPost(currentPostId); return; }
      const more = e.target.closest("#more-comments");
      if (more) { loadComments(hnCache[currentPostId], Number(more.dataset.next), postGen); return; }
      const rel = e.target.closest(".related-link");
      if (rel && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); openPost(rel.dataset.id); }
    });

    // ── Load top stories (init + refresh) ──
    async function loadTop() {
      const myGen = ++gen;
      loading = false;
      loaded = 0;
      allIds = [];
      document.getElementById("stories").innerHTML = "";
      document.getElementById("status").textContent = "Loading...";
      let ids;
      try {
        const r = await fetch(`${HN}/topstories.json`);
        if (!r.ok) throw new Error(`topstories: ${r.status}`);
        ids = await r.json();
      } catch {
        if (myGen === gen) showError("Failed to load stories.");
        return;
      }
      if (myGen !== gen) return;
      const prev = loadJSON(PREV_TOP_KEY, null);
      const prevSet = new Set(Array.isArray(prev) ? prev : []);
      newIds = new Set(prevSet.size ? ids.filter((id) => !prevSet.has(id)) : []);
      saveJSON(PREV_TOP_KEY, ids);
      allIds = ids;
      await loadMore();
      if (myGen === gen && loaded > 0) {
        lastUpdated = Date.now();
        renderUpdated();
      }
    }

    let refreshing = false;
    async function refresh() {
      if (refreshing) return;
      refreshing = true;
      const label = document.getElementById("refresh-label");
      label.textContent = " ...";
      try {
        await loadTop();
      } finally {
        refreshing = false;
        label.textContent = " refresh";
      }
    }

    function refreshCurrent() {
      if (!postOpen()) return refresh();
      delete hnCache[currentPostId];
      return showPost(currentPostId);
    }

    document.getElementById("refresh-btn").addEventListener("click", refreshCurrent);
    applyCompact();
    applyHideRead();
    refresh();
    route();

    // ── Pull-to-refresh ──
    let touchStartY = 0;
    let pulling = false;
    const pullEl = document.getElementById("pull-indicator");

    document.addEventListener("touchstart", (e) => {
      if (window.scrollY === 0) touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (touchStartY === 0) return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 0 && window.scrollY === 0) {
        pulling = true;
        const h = Math.min(dy * 0.4, 40);
        pullEl.style.height = h + "px";
        pullEl.textContent = h >= 35 ? "↓ release to refresh" : "↓ pull to refresh";
      }
    }, { passive: true });

    document.addEventListener("touchend", () => {
      if (pulling && parseInt(pullEl.style.height) >= 35) {
        pullEl.textContent = "refreshing...";
        pullEl.style.height = "24px";
        Promise.resolve(refreshCurrent()).finally(() => {
          pullEl.style.height = "0";
        });
      } else {
        pullEl.style.height = "0";
      }
      touchStartY = 0;
      pulling = false;
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
